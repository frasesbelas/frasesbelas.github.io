function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function tile(i,extra){var d=D[i];return '<article class="tile c-'+d[0]+(extra||"")+'"><p class="cat">'+N[d[0]]+'</p><p class="phrase">'+d[1]+'</p><div class="actions"><button class="btn main" data-a="wa" data-i="'+i+'">Enviar no WhatsApp</button><button class="btn" data-a="copy" data-i="'+i+'">Copiar</button></div></article>'}
function chips(){var h='<button class="chip" data-c="todas" aria-pressed="'+(cat==="todas")+'">Todas</button>';for(var k in N){h+='<button class="chip" data-c="'+k+'" aria-pressed="'+(cat===k)+'">'+N[k]+'</button>'}document.getElementById("chips").innerHTML=h}
/* ANÚNCIOS: 1) mete o script da rede no <head>; 2) põe ADS.on=true; 3) escreve aqui o código que preenche cada espaço (el). */
function fillAd(el){}
function initAds(){if(!ADS.on)return;var a=document.querySelectorAll(".ad:not(.on)");for(var i=0;i<a.length;i++){a[i].classList.add("on");fillAd(a[i])}}
function add(){var h="",end=Math.min(shown+PAGE,cur.length);for(var k=shown;k<end;k++){h+=tile(cur[k]);if((k+1)%ADS.every===0)h+='<aside class="ad" aria-label="Publicidade"></aside>'}document.getElementById("list").insertAdjacentHTML("beforeend",h);shown=end;document.getElementById("more").hidden=shown>=cur.length;initAds()}
function list(){cur=[];for(var i=0;i<D.length;i++){if(cat!=="todas"&&D[i][0]!==cat)continue;if(q&&norm(D[i][1]).indexOf(q)<0)continue;cur.push(i)}shown=0;document.getElementById("list").innerHTML=cur.length?"":'<p class="empty">Nenhuma frase encontrada.</p>';document.getElementById("count").textContent=cur.length+" frases";document.getElementById("listTitle").textContent=cat==="todas"?"Todas as frases":"Frases de "+N[cat].toLowerCase();add()}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";clearTimeout(toast.t);toast.t=setTimeout(function(){t.className="toast"},1800)}
function text(i){return D[i][1]}
function wa(s){var u="https://wa.me/?text="+encodeURIComponent(s);if(navigator.share){navigator.share({text:s}).catch(function(e){if(!e||e.name!=="AbortError")location.href=u})}else{location.href=u}}
function copy(s){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(s)}return new Promise(function(ok,no){var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy")?ok():no()}catch(e){no()}document.body.removeChild(a)})}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(b.id==="more"){add();return}
if(b.dataset.c){cat=b.dataset.c;chips();list();return}
var i=b.dataset.i;if(i===undefined)return;
if(b.dataset.a==="copy"){copy(text(i)).then(function(){toast("Copiado")},function(){toast("Não foi possível copiar")})}
else{wa(text(i))}});
document.getElementById("q").addEventListener("input",function(e){q=norm(e.target.value.trim());list()});
chips();list();document.getElementById("today").innerHTML=tile(Math.floor(Date.now()/864e5)%D.length," today");initAds();
</script>
</body>
</html>
